name: Verify decision world

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m decision_world.cli fixtures/product-launch-world.json --output /tmp/decision-plan.json
      - run: python -m decision_world.cli fixtures/product-launch-world.json --audience-result fixtures/audience-result-small.json --output /tmp/decision-with-audience.json
